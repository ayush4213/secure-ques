services:
  securepaper:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECUREPAPER_ADMIN_KEY: ${SECUREPAPER_ADMIN_KEY:-demo1234}
      SECUREPAPER_DATA_DIR: /app/data
      SECUREPAPER_CORS_ORIGINS: ${SECUREPAPER_CORS_ORIGINS:-}
    volumes:
      - securepaper_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  securepaper_data:
